services:
  data_pipeline:
    build:
      context: .
      dockerfile: DockerFile
    container_name: data_pipeline_container
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app
    working_dir: /app
    command: ["bash", "auto_command_script.sh"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_URL=https://example.com/yellow_tripdata_2026-01.parquet
